<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quality Insight · 인증</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-brand">
      <span class="eyebrow">POSCO FUTURE M / QUALITY SYSTEM</span>
      <h1>Quality<br /><em>Insight</em></h1>
      <p>생산 데이터의 신호를 읽고, 품질 리스크를 먼저 발견하세요.</p>
      <div class="auth-rail"><span></span><span></span><span></span></div>
    </section>
    <section class="auth-card" aria-labelledby="form-title">
      <span class="eyebrow">SECURE ACCESS</span>
      <h2 id="form-title">품질 인사이트 로그인</h2>
      <p id="form-hint" class="muted">등록한 이메일로 대시보드에 접속하세요.</p>
      <form id="auth-form">
        <label id="name-field" hidden>이름<input id="full-name" type="text" autocomplete="name" /></label>
        <label>이메일<input id="email" type="email" autocomplete="email" required /></label>
        <label>비밀번호<input id="password" type="password" minlength="6" autocomplete="current-password" required /></label>
        <button id="submit-button" class="button primary" type="submit">로그인</button>
      </form>
      <p id="auth-message" class="message" hidden></p>
      <button id="mode-button" class="button link" type="button">처음 방문하셨나요? 계정 만들기</button>
      <p class="security-note">세션은 Supabase Auth가 암호화된 브라우저 저장소에서 관리합니다.</p>
    </section>
  </main>
  <script src="config.js"></script>
  <script type="module" src="src/auth.js"></script>
</body>
</html>
