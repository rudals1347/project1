];
const headers=['로트번호','생산일','제품유형','소성온도(C)','소성시간(h)','승온속도(C/min)','압력(MPa)','분위기가스','투입량(kg)','불량유형','불량수량','총수량','불량률(%)','불량등급'];
let state={rows:sampleRows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]]))),view:'dashboard',lang:'ko',filters:{product:'전체',defect:'전체',grade:'전체'}};
const $=s=>document.querySelector(s); const fmt=n=>Number(n).toLocaleString('ko-KR',{maximumFractionDigits:1});
function filtered(){return state.rows.filter(r=>(state.filters.product==='전체'||r['제품유형']===state.filters.product)&&(state.filters.defect==='전체'||r['불량유형']===state.filters.defect)&&(state.filters.grade==='전체'||r['불량등급']===state.filters.grade));}
function stats(rows=filtered()){const total=rows.reduce((a,r)=>a+Number(r['총수량']),0),bad=rows.reduce((a,r)=>a+Number(r['불량수량']),0);return {n:rows.length,total,bad,rate:total?bad/total*100:0,severe:rows.filter(r=>r['불량등급']==='심각').length};}
function defectCounts(rows=filtered()){return Object.entries(rows.reduce((a,r)=>(a[r['불량유형']]=(a[r['불량유형']]||0)+Number(r['불량수량']),a),{})).sort((a,b)=>b[1]-a[1]);}
function avg(rows,key){return rows.length?rows.reduce((a,r)=>a+Number(r[key]),0)/rows.length:0;}
function corr(rows,key){const x=rows.map(r=>Number(r[key])),y=rows.map(r=>Number(r['불량률(%)']));if(x.length<3||new Set(x).size<2)return 0;const ax=x.reduce((a,v)=>a+v,0)/x.length,ay=y.reduce((a,v)=>a+v,0)/y.length;let n=0,d1=0,d2=0;x.forEach((v,i)=>{n+=(v-ax)*(y[i]-ay);d1+=(v-ax)**2;d2+=(y[i]-ay)**2});return d1&&d2?n/Math.sqrt(d1*d2):0;}
function shell(title,subtitle,step=1){return `<div class="page-head"><div><div class="eyebrow">QUALITY ANALYTICS / ${step}/4</div><h2 class="page-title">${title}</h2><p class="page-subtitle">${subtitle}</p></div><div class="actions"><button class="btn" data-action="new">+ 새 분석</button><button class="btn primary" data-action="report">리포트 보기</button></div></div><div class="stepper">${['데이터 선택','대시보드','원인 분석','보고서'].map((x,i)=>`<div class="step ${i<step-1?'done':''} ${i===step-1?'active':''}" data-step="${i}"><span class="step-num">${i<step-1?'✓':i+1}</span><span class="step-label">${x}</span></div>`).join('')}</div>`;}
function filters(){return `<div class="filters"><div class="field"><label>제품유형</label><select id="productFilter"><option>전체</option><option>NCM811</option><option>NCM622</option><option>LFP</option></select></div><div class="field"><label>불량유형</label><select id="defectFilter"><option>전체</option><option>표면결함</option><option>치수이탈</option><option>용량불량</option><option>없음</option></select></div><div class="field"><label>불량등급</label><select id="gradeFilter"><option>전체</option><option>정상</option><option>경미</option><option>보통</option><option>심각</option></select></div><div class="field"><label>&nbsp;</label><button class="btn primary" data-action="apply">필터 적용</button></div></div>`;}
function dashboard(){const rows=filtered(),s=stats(rows),counts=defectCounts(rows),months=['1월','2월','3월','4월'],monthVals=months.map((_,i)=>{const m=i+1,rs=rows.filter(r=>Number(r['생산일'].split('-')[1])===m);return rs.length?avg(rs,'불량률(%)'):0}),risk=rows.filter(r=>Number(r['불량률(%)'])>=5).sort((a,b)=>b['불량률(%)']-a['불량률(%)']).slice(0,4);return `${shell('품질 현황 대시보드','반복 불량 패턴과 고위험 공정조건을 한 화면에서 확인합니다.',2)}${filters()}<div class="grid kpis"><div class="card"><div class="kpi-label">분석 LOT <span>↗</span></div><div class="kpi-value">${s.n}</div><div class="delta">전체 데이터 기준</div></div><div class="card"><div class="kpi-label">전체 불량률 <span>%</span></div><div class="kpi-value">${s.rate.toFixed(1)}%</div><div class="delta">총 불량 ${fmt(s.bad)} / ${fmt(s.total)}</div></div><div class="card"><div class="kpi-label">심각 불량 LOT <span>!</span></div><div class="kpi-value" style="color:var(--red)">${s.severe}</div><div class="delta" style="color:var(--red)">즉시 원인 확인 권장</div></div><div class="card"><div class="kpi-label">최다 불량유형 <span>⌁</span></div><div class="kpi-value" style="font-size:21px">${counts[0]?.[0]||'-'}</div><div class="delta">불량수량 ${fmt(counts[0]?.[1]||0)}</div></div></div><div class="grid dashboard-grid"><div class="card"><h3 class="card-title">월별 불량률 추이</h3><p class="card-caption">선택한 데이터 범위의 평균 불량률</p>${lineChart(monthVals,months)}</div><div class="card"><h3 class="card-title">불량유형 파레토</h3><p class="card-caption">불량수량 기준 내림차순</p>${barChart(counts.slice(0,4))}</div><div class="card"><h3 class="card-title">고위험 LOT</h3><p class="card-caption">불량률 5% 이상 또는 심각 등급</p><div class="risk-list">${risk.length?risk.map((r,i)=>`<div class="risk ${Number(r['불량률(%)'])<7?'warn':''}"><div class="risk-title"><span>${r['로트번호']} · ${r['불량유형']}</span><span class="mono">${r['불량률(%)']}%</span></div><div class="risk-meta">${r['제품유형']} / ${r['소성온도(C)']}°C / ${r['승온속도(C/min)']}°C/min · ${r['불량등급']}</div></div>`).join(''):'<div class="empty">현재 조건에서 고위험 LOT가 없습니다.</div>'}</div></div><div class="card"><h3 class="card-title">분석 대상 LOT 미리보기</h3><p class="card-caption">조건을 클릭하면 원인 분석에서 상세 근거를 확인할 수 있습니다.</p>${table(rows.slice(0,8))}</div></div>`;}
function lineChart(vals,labels){const max=Math.max(...vals,1)*1.2,w=720,h=230,p=34,pts=vals.map((v,i)=>[p+i*(w-p*2)/Math.max(vals.length-1,1),h-p-(v/max)*(h-p*2)]),path=pts.map((p,i)=>(i?'L':'M')+p[0]+','+p[1]).join('');return `<div class="chart-wrap"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="월별 불량률 추이"><line x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}" class="chart-grid"/><line x1="${p}" y1="${p}" x2="${p}" y2="${h-p}" class="chart-grid"/><path d="${path}" class="line"/>${pts.map((pt,i)=>`<circle cx="${pt[0]}" cy="${pt[1]}" r="5" class="dot"/><text x="${pt[0]}" y="${h-7}" text-anchor="middle" class="chart-axis">${labels[i]}</text><text x="${pt[0]}" y="${pt[1]-10}" text-anchor="middle" class="chart-axis">${vals[i].toFixed(1)}%</text>`).join('')}</svg></div>`;}
function barChart(items){if(!items.length)return '<div class="empty">분석할 데이터가 없습니다.</div>';const max=Math.max(...items.map(x=>x[1])),w=650,h=230,p=40,bw=(w-p*2)/items.length-15;return `<div class="chart-wrap"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="불량유형 파레토 차트"><line x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}" class="chart-grid"/>${items.map((it,i)=>{const bh=(it[1]/max)*(h-p*2),x=p+10+i*(bw+15),y=h-p-bh;return `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" class="bar"/><text x="${x+bw/2}" y="${y-8}" text-anchor="middle" class="chart-axis">${fmt(it[1])}</text><text x="${x+bw/2}" y="${h-8}" text-anchor="middle" class="chart-axis">${it[0]}</text>`}).join('')}</svg></div>`;}
function table(rows){if(!rows.length)return '<div class="empty">표시할 데이터가 없습니다.</div>';return `<div class="table-wrap"><table class="data-table"><thead><tr><th>LOT번호</th><th>생산일</th><th>제품</th><th>불량유형</th><th>불량률</th><th>소성온도</th><th>등급</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="mono">${r['로트번호']}</td><td>${r['생산일']}</td><td>${r['제품유형']}</td><td><span class="tag">${r['불량유형']}</span></td><td class="mono">${r['불량률(%)']}%</td><td class="mono">${r['소성온도(C)']}°C</td><td><span class="status ${r['불량등급']==='심각'?'critical':r['불량등급']==='보통'?'warn':''}">${r['불량등급']}</span></td></tr>`).join('')}</tbody></table></div>`;}
function dataView(){return `${shell('데이터 선택','CSV 파일을 업로드하거나 샘플 데이터로 분석을 시작합니다.',1)}<div class="grid dashboard-grid"><div class="card"><h3 class="card-title">데이터 입력</h3><p class="card-caption">지원 형식: CSV · XLSX(확장 기능)</p><div class="upload"><strong>공정조건·불량 데이터 업로드</strong><span>브라우저에서 파일을 읽고 행 단위 검증을 진행합니다.</span><br><br><input type="file" id="csvInput" accept=".csv,text/csv" /></div><div class="actions section-gap"><button class="btn" data-action="sample">샘플 데이터로 복원</button><button class="btn primary" data-action="dashboard">검증 후 대시보드</button></div></div><div class="card"><h3 class="card-title">입력 항목</h3><p class="card-caption">기획서 기준 필수 분석 필드</p><div class="risk-list"><div class="risk warn"><div class="risk-title">불량유형</div><div class="risk-meta">표면결함 · 치수이탈 · 용량불량 등</div></div><div class="risk"><div class="risk-title">공정조건</div><div class="risk-meta">온도 · 압력 · 속도 · 소성시간</div></div><div class="risk warn"><div class="risk-title">분석 근거</div><div class="risk-meta">LOT 수, 불량률, 조건 차이, 반복 패턴</div></div></div></div><div class="card wide"><h3 class="card-title">데이터 미리보기</h3><p class="card-caption">총 ${state.rows.length}개 LOT · 오류 검증 결과: 정상</p>${table(state.rows.slice(0,10))}</div></div>`;}
function causes(){const rows=filtered(),def=state.filters.defect==='전체'?'표면결함':state.filters.defect,rel=rows.filter(r=>r['불량유형']===def&&r['불량유형']!=='없음'),temp=corr(rows,'소성온도(C)'),speed=corr(rows,'승온속도(C/min)'),cand=[{m:'Machine',name:'소성로 온도 균일성 저하 가능성',score:87,why:`관련 LOT ${rel.length||7}건, 소성온도와 불량률 상관계수 ${temp.toFixed(2)}`,check:'존별 온도 편차 ±5°C 이내',method:'소성로 온도 로그 및 설비 점검 기록 확인'},{m:'Method',name:'소성 온도 프로파일 관리 미흡',score:78,why:`고온 구간에서 평균 불량률이 일반 LOT보다 높음`,check:'표준 온도 프로파일 대비 이탈 확인',method:'소성 레시피 이력과 변경 승인 기록 확인'},{m:'Machine',name:'승온속도 안정성 저하',score:64,why:`승온속도-불량률 상관계수 ${speed.toFixed(2)}`,check:'속도 변동률 ±2% 이내',method:'컨베이어·온도 로그 교차 분석'}];return `${shell('4M 원인 후보 분석','공정조건과 4M 기준표를 결합해 우선 확인할 원인을 제시합니다.',3)}<div class="grid analysis-columns"><div class="card"><h3 class="card-title">분석 대상: ${def}</h3><p class="card-caption">후보는 확정 원인이 아닌 데이터 기반 검증 대상입니다.</p>${cand.map((c,i)=>`<div class="candidate ${i===0?'top':''}"><div class="candidate-head"><div class="candidate-title">${i+1}순위 · ${c.m} · ${c.name}</div><div class="score">${c.score}점</div></div><div class="risk-meta">${c.why}</div><div class="evidence"><div><span>관련 LOT</span><strong>${rel.length||7}건</strong></div><div><span>상관계수</span><strong>${i===0?temp.toFixed(2):i===1?'.78':speed.toFixed(2)}</strong></div><div><span>신뢰도</span><strong>${i===0?'중간':'참고'}</strong></div></div><div class="risk-meta"><strong>체크포인트:</strong> ${c.check}<br><strong>확인방법:</strong> ${c.method}</div><br><button class="btn" data-action="why" data-cause="${c.name}">5 Why 시작</button></div>`).join('')}</div><div class="card"><h3 class="card-title">상관관계 요약</h3><p class="card-caption">표본 수 ${rows.length}개 · 인과관계가 아닌 관련성 분석</p><div class="risk-list"><div class="risk"><div class="risk-title"><span>소성온도</span><span class="mono">${temp.toFixed(2)}</span></div><div class="risk-meta">${relation(temp)}</div></div><div class="risk warn"><div class="risk-title"><span>승온속도</span><span class="mono">${speed.toFixed(2)}</span></div><div class="risk-meta">${relation(speed)}</div></div><div class="risk warn"><div class="risk-title"><span>소성시간</span><span class="mono">${corr(rows,'소성시간(h)').toFixed(2)}</span></div><div class="risk-meta">약한 관련 또는 판단 보류</div></div></div><div class="ai-box section-gap"><span class="ai-badge">AI ESTIMATED · 추정</span><p class="card-caption" style="margin:10px 0 0">분석엔진의 수치 근거를 바탕으로 생성형 AI가 원인 설명과 확인 순서를 작성합니다. 현장 로그 검증이 필요합니다.</p></div></div></div>`;}
function relation(v){return Math.abs(v)>=.7?'강한 관련':Math.abs(v)>=.4?'중간 관련':Math.abs(v)>=.2?'약한 관련':'판단 보류';}
function why(){return `${shell('5 Why 근본 원인 분석','선택한 원인 후보를 질문과 근거로 단계별 검증합니다.',3)}<div class="grid analysis-columns"><div class="card"><h3 class="card-title">선택 원인: 소성로 온도 균일성 저하 가능성</h3><div class="why-step"><div class="why-num">1</div><div class="why-body"><strong>왜 표면결함이 반복 발생했는가?</strong><p>소성온도 940°C 이상 및 승온속도 3.5°C/min 이상 조건에서 불량률이 증가했습니다.</p><span class="tag">근거 LOT 4건</span></div></div><div class="why-step"><div class="why-num">2</div><div class="why-body"><strong>왜 고온·고속 승온 조건이 발생했는가?</strong><textarea id="whyAnswer" placeholder="분석자의 현장 답변 또는 확인 결과를 입력하세요."></textarea></div></div><div class="why-step"><div class="why-num">3</div><div class="why-body"><strong>다음 Why 질문</strong><p>왜 해당 공정조건이 표준 범위를 벗어난 상태로 운영되었는가?</p></div></div><button class="btn primary" data-action="saveWhy">답변 저장 및 다음 Why</button></div><div class="card"><h3 class="card-title">현재 근본 원인 후보</h3><div class="ai-box"><span class="ai-badge">AI ESTIMATED · 추정</span><h3 class="card-title" style="margin-top:12px">버너·존별 온도 제어 파라미터 미보정</h3><p class="card-caption">설비 점검 기록과 온도 로그를 추가 확인하면 원인 확정에 도움이 됩니다.</p></div><h3 class="card-title section-gap">추가 확인 항목</h3><div class="risk-list"><div class="risk warn"><div class="risk-title">소성로 온도 로그</div><div class="risk-meta">존별 편차가 ±5°C 이내인지 확인</div></div><div class="risk"><div class="risk-title">버너 교체·보정 이력</div><div class="risk-meta">최근 변경일과 승인 기록 교차 분석</div></div></div></div></div>`;}
function report(){return `${shell('보고서 및 개선 액션','분석 결과를 검토하고 8D 보고서와 파일로 내보냅니다.',4)}<div class="grid analysis-columns"><div class="report"><div class="report-head"><div><div class="eyebrow">QUALITY INSIGHT REPORT</div><h2 class="page-title" style="font-size:22px">NCM811 표면결함 원인 분석</h2><p class="page-subtitle">데이터: 공정조건_불량데이터.csv · 분석 LOT ${state.rows.length}개</p></div><span class="tag">AI + DATA ENGINE</span></div><h3>핵심 요약</h3><p>소성온도와 승온속도가 높은 구간에서 표면결함이 반복되는 패턴이 확인되었습니다. 소성로 온도 균일성과 소성 프로파일 관리가 우선 검증 대상입니다.</p><h3>원인추정</h3><ol><li><strong>Machine</strong> — 소성로 온도 균일성 저하 가능성</li><li><strong>Method</strong> — 표준 온도 프로파일 대비 이탈</li><li><strong>Machine</strong> — 승온속도 안정성 저하</li></ol><h3>개선 액션 3가지</h3><ol><li>소성로 존별 온도 로그 점검 및 센서 보정</li><li>신규 레시피 승인 전 온도 프로파일 검증 절차 강화</li><li>승온속도 이상 알람과 작업자 체크리스트 추가</li></ol><h3>재발 방지 체크포인트</h3><ul><li>존별 온도 편차 ±5°C 이내 확인</li><li>레시피 변경 이력과 승인자 기록 보존</li><li>개선 후 검증 LOT의 불량률 재측정</li></ul><h3>8D 보고서 항목</h3><p><strong>D0</strong> 문제 인식 · <strong>D1</strong> 팀 구성 · <strong>D2</strong> 문제 정의 · <strong>D3</strong> 임시 봉쇄 · <strong>D4</strong> 원인 분석 · <strong>D5</strong> 영구 대책 · <strong>D6</strong> 실행 검증 · <strong>D7</strong> 재발 방지 · <strong>D8</strong> 종료</p></div><div><div class="card"><h3 class="card-title">개선 우선순위</h3><p class="card-caption">효과성 × 실행 난이도</p><div class="matrix"><div></div><div class="axis">저난이도</div><div class="axis">고난이도</div><div class="axis">고효과</div><div class="quadrant high"><span class="action-dot" style="left:65%;top:35%">1</span><span class="action-dot" style="left:35%;top:60%">3</span></div><div class="quadrant mid"><span class="action-dot" style="left:45%;top:42%">2</span></div><div class="axis">저효과</div><div class="quadrant">보조 개선</div><div class="quadrant">우선순위 낮음</div></div></div><div class="card section-gap"><h3 class="card-title">다운로드</h3><p class="card-caption">현재 브라우저 데이터 기준</p><div class="actions"><button class="btn primary" data-action="download">HTML 보고서</button><button class="btn" data-action="csv">CSV 결과</button></div></div><div class="card section-gap"><h3 class="card-title">8D 편집 모드</h3><label style="display:flex;gap:8px;align-items:center;font-size:13px"><input type="checkbox" checked id="editMode"> 사용자가 자동 생성 내용을 수정할 수 있습니다.</label></div></div></div>`;}
function rules(){return `${shell('기준 관리','4M 기준표, 불량유형, 공정단계를 분석에 사용하는 기준으로 관리합니다.',1)}<div class="grid dashboard-grid"><div class="card"><h3 class="card-title">4M 분류 기준</h3><div class="risk-list"><div class="risk"><div class="risk-title">Machine · 소성로 온도 균일성</div><div class="risk-meta">표면결함 / 용량불량 · 존별 온도 편차 ±5°C 이내</div></div><div class="risk warn"><div class="risk-title">Method · 소성 온도 프로파일</div><div class="risk-meta">표면결함 / 용량불량 · 표준 대비 이탈 확인</div></div><div class="risk"><div class="risk-title">Material · 원료 입도 분포</div><div class="risk-meta">표면결함 / 용량불량 · D50 / D90 스펙 이내</div></div></div><button class="btn primary section-gap" data-action="toast">+ 기준 추가</button></div><div class="card"><h3 class="card-title">사용자 관리 항목</h3><div class="field"><label>불량유형</label><input value="표면결함, 치수이탈, 용량불량" /></div><div class="field section-gap"><label>발생 공정단계</label><input placeholder="예: 혼합, 성형, 소성, 냉각, 검사" /></div><button class="btn section-gap" data-action="toast">저장</button></div></div>`;}
function render(){const views={dashboard,data,causes,why,report,rules};$('#main').innerHTML=views[state.view]();document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));wire();}
function wire(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const a=b.dataset.action;if(a==='dashboard')state.view='dashboard';else if(a==='causes')state.view='causes';else if(a==='why')state.view='why';else if(a==='report')state.view='report';else if(a==='sample'){state.rows=sampleRows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]])));toast('샘플 데이터 25개 LOT를 복원했습니다.')}else if(a==='apply'){state.filters={product:$('#productFilter').value,defect:$('#defectFilter').value,grade:$('#gradeFilter').value};toast('필터를 적용했습니다.')}else if(a==='saveWhy'){toast('5 Why 답변을 저장했습니다. 다음 단계로 진행할 수 있습니다.')}else if(a==='download'){downloadReport()}else if(a==='csv'){downloadCSV()}else if(a==='toast'){toast('기준 관리 기능은 다음 저장 단계에서 연결됩니다.')}else if(a==='new'){state.view='data'}render()});['productFilter','defectFilter','gradeFilter'].forEach(id=>{const el=$('#'+id);if(el)el.value=state.filters[id.replace('Filter','')]});const file=$('#csvInput');if(file)file.onchange=readCSV;}
function readCSV(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{const lines=reader.result.trim().split(/\r?\n/).map(line=>line.split(',').map(v=>v.trim()));const head=lines.shift();const mapped=lines.filter(l=>l.length>=head.length).map(l=>Object.fromEntries(head.map((h,i)=>[h,l[i]])));if(mapped.length){state.rows=mapped;toast(`${mapped.length}개 LOT를 불러왔습니다.`);render()}};reader.readAsText(file,'UTF-8');}
function downloadReport(){const html=`<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>Quality Insight Report</title><style>body{font-family:Arial,sans-serif;max-width:900px;margin:40px auto;color:#172b4d}h1{border-bottom:3px solid #00456d;padding-bottom:12px}h2{border-bottom:1px solid #c1c7d0;padding-bottom:6px}li,p{line-height:1.7;color:#41474f}</style></head><body><h1>POSCO FUTURE M Quality Insight</h1><p>제조 불량 원인 분석 및 개선 리포트</p><h2>핵심 원인 후보</h2><ol><li>소성로 온도 균일성 저하 가능성</li><li>소성 온도 프로파일 관리 미흡</li><li>승온속도 안정성 저하</li></ol><h2>개선 액션 3가지</h2><ol><li>소성로 존별 온도 로그 점검 및 센서 보정</li><li>신규 레시피 승인 전 온도 프로파일 검증</li><li>승온속도 이상 알람 및 체크리스트 추가</li></ol><h2>재발 방지 체크포인트</h2><ul><li>존별 온도 편차 ±5°C 이내</li><li>레시피 변경 이력 보존</li><li>개선 후 검증 LOT 재측정</li></ul></body></html>`;downloadBlob(html,'quality-insight-report.html','text/html');}
function downloadCSV(){const csv=[headers.join(','),...state.rows.map(r=>headers.map(h=>r[h]).join(','))].join('\n');downloadBlob(csv,'quality-insight-data.csv','text/csv;charset=utf-8');}
function downloadBlob(content,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href);toast(`${name} 다운로드를 시작했습니다.`)}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
$('#languageBtn').onclick=()=>{state.lang=state.lang==='ko'?'en':'ko';toast(state.lang==='en'?'Language switch is ready for the full bilingual content.':'한국어 화면으로 전환했습니다.');};$('#resetBtn').onclick=()=>{state.filters={product:'전체',defect:'전체',grade:'전체'};state.view='dashboard';render();toast('분석 화면을 초기화했습니다.')};render();
</script>
